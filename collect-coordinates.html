let results = [];
let ps;

kakao.maps.load(function() {
  ps = new kakao.maps.services.Places();
  document.getElementById('status').textContent = `준비 완료! (총 ${cafeterias.length}개 식당)`;
});

function log(msg, type='') {
  const l = document.getElementById('log');
  const cls = type ? `class="${type}"` : '';
  l.innerHTML += `<div ${cls}>${msg}</div>`;
  l.scrollTop = l.scrollHeight;
}

function searchOne(cafe) {
  return new Promise((resolve) => {
    ps.keywordSearch(cafe.keyword, (data, status) => {
      if(status === kakao.maps.services.Status.OK && data.length > 0) {
        const found = data[0];
        resolve({
          id: cafe.id,
          lat: parseFloat(found.y),
          lng: parseFloat(found.x),
          matched_name: found.place_name,
          status: 'ok'
        });
      } else {
        resolve({ id: cafe.id, status: 'fail' });
      }
    });
  });
}

async function start() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('log').innerHTML = '';
  results = [];
  
  for(let i = 0; i < cafeterias.length; i++) {
    const cafe = cafeterias[i];
    document.getElementById('status').innerHTML = `<div id="progress">진행 중: ${i+1}/${cafeterias.length}</div>`;
    
    const result = await searchOne(cafe);
    results.push(result);
    
    if(result.status === 'ok') {
      log(`✅ [id:${cafe.id}] ${cafe.keyword} → ${result.matched_name} (${result.lat}, ${result.lng})`, 'success');
    } else {
      log(`❌ [id:${cafe.id}] ${cafe.keyword} → 못 찾음`, 'error');
    }
    
    // API 호출 간격 (너무 빠르면 차단)
    await new Promise(r => setTimeout(r, 200));
  }
  
  const successCount = results.filter(r => r.status === 'ok').length;
  document.getElementById('status').innerHTML = `✅ 완료! ${successCount}/${cafeterias.length} 성공`;
  
  // 결과를 JSON으로 표시
  const output = {};
  results.forEach(r => {
    if(r.status === 'ok') {
      output[r.id] = { lat: r.lat, lng: r.lng };
    }
  });
  document.getElementById('result').value = JSON.stringify(output, null, 2);
  document.getElementById('downloadBtn').disabled = false;
}

function download() {
  const output = {};
  results.forEach(r => {
    if(r.status === 'ok') {
      output[r.id] = { lat: r.lat, lng: r.lng };
    }
  });
  const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'coordinates.json';
  a.click();
}
